name: Detect mobile changes

on:
  workflow_call:
    outputs:
      android:
        description: Whether Android checks are needed
        value: ${{ jobs.changes.outputs.android }}
      ios:
        description: Whether iOS checks are needed
        value: ${{ jobs.changes.outputs.ios }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
      ios: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ios == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - name: Detect platform changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: .github/filters/mobile.yml
