name: iOS build verification

on:
  pull_request:
    branches: [main, develop]
    paths:
      - .github/workflows/ios-*.yml
      - build-logic/**
      - buildSrc/**
      - composeApp/**
      - core/**
      - feature/**
      - features/**
      - gradle/**
      - iosApp/**
      - iosXtool/CoffeePeek/**
      - tools/ios/**
      - tools/release/test_ios_signing_profile.py
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
      - '!**/src/android*/**'
      - '!**/proguard-rules.pro'
      - '!**/*.md'
  push:
    # Runs the verification on main so its Gradle/konan/SPM caches land in the
    # default-branch scope, which every PR branch can restore: a first push of a
    # new PR starts warm instead of paying the full cold K/N compilation.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Same-repo PRs write caches so follow-up pushes reuse their outputs; forks stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Cache Kotlin/Native toolchain and dependency klibs
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@v4
        with:
          # xcodebuild checkouts plus the Gradle-side SPM artifacts (onnxruntime pod archive).
          path: |
            ~/SourcePackages
            build/kotlin/swiftPMCheckouts
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'feature/shelf/data/ShelfOnnxRuntime/Package.swift') }}
      - name: Check CI configuration and prepare unsigned Firebase resource
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/ios -p 'test_*.py'
          python3 -m unittest discover -s tools/release -p test_ios_signing_profile.py
          cp tools/ios/GoogleService-Info.verification.plist iosApp/iosApp/GoogleService-Info.plist

      - name: Compile iPhone launch catalog for xtool
        shell: bash
        run: bash iosXtool/CoffeePeek/prepare-launch-resources.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ios-launch-resources
          path: iosXtool/CoffeePeek/.build/launch-resources/Assets.car
          if-no-files-found: error
          retention-days: 7

      - name: Compile Kotlin and native Swift for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-verify" \
            -clonedSourcePackagesDirPath "$HOME/SourcePackages" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-verify.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-verify.log"
              exit 1
            }
      - name: Verify app and embedded ONNX minimum OS
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/ios-verify/Build/Products/Debug-iphonesimulator/CoffeePeek.app"
          MINIMUM_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")
          EXPECTED_MINIMUM_OS=$(sed -n 's/^IPHONEOS_DEPLOYMENT_TARGET = //p' iosApp/Configuration/Shared.xcconfig)
          [[ "$MINIMUM_OS" == "$EXPECTED_MINIMUM_OS" ]]
          python3 tools/ios/fix_onnx_framework.py "$APP_PATH/Frameworks/onnxruntime.framework" \
            --deployment-target "$MINIMUM_OS" --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-build-log
          path: |
            ${{ runner.temp }}/ios-verify.log
            iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 7

  # Runs next to the app build instead of after it: the K/N test binaries compile on their
  # own runner, so the wall time is max(build, tests) rather than their sum.
  kotlin-native-tests:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Same-repo PRs write caches so follow-up pushes reuse their outputs; forks stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Cache Kotlin/Native toolchain and dependency klibs
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@v4
        with:
          # The Gradle-side SPM artifacts (onnxruntime pod archive) used by iosMain compilation.
          path: build/kotlin/swiftPMCheckouts
          key: spm-gradle-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'feature/shelf/data/ShelfOnnxRuntime/Package.swift') }}
      - name: Run Kotlin Native contract tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :composeApp:iosSimulatorArm64Test \
            --tests 'com.coffeepeek.admin.di.KoinViewModelCompatibilityTest' \
            --tests 'com.coffeepeek.admin.AppLinkHandlingTest' \
            --tests 'com.coffeepeek.admin.ui.AppLinksTest' \
            --tests 'com.coffeepeek.admin.di.profile.IosProfileCompositionTest' \
            --tests 'com.coffeepeek.admin.ui.NavigationDelegateTest' \
            --tests 'com.coffeepeek.admin.ui.MainTabReselectionsTest' \
            --tests 'com.coffeepeek.admin.ui.TabDelegateTest' \
            --tests 'com.coffeepeek.admin.di.shelf.IosShelfModuleTest' \
            --tests 'com.coffeepeek.admin.ui.NativeTabBarVisibilityTest' \
            --tests 'com.coffeepeek.admin.ui.component.GlassIconConfigurationTest' \
            > "$RUNNER_TEMP/ios-native-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-native-tests.log"
              exit 1
            }
      - name: Run shared business ownership unit and contract tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :feature:business-ownership:domain:iosSimulatorArm64Test \
            :feature:business-ownership:data:iosSimulatorArm64Test \
            :feature:business-ownership:impl:iosSimulatorArm64Test \
            > "$RUNNER_TEMP/ios-ownership-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-ownership-tests.log"
              exit 1
            }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-tests-log
          path: |
            ${{ runner.temp }}/ios-native-tests.log
            ${{ runner.temp }}/ios-ownership-tests.log
            feature/business-ownership/**/build/test-results/iosSimulatorArm64Test/
            composeApp/build/test-results/iosSimulatorArm64Test/
          retention-days: 7
