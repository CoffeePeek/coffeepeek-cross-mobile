name: iOS build verification

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile_ios:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop') }}
      - name: Compile Kotlin and native Swift for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-verify" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-verify.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-verify.log"
              exit 1
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-verify.log
          retention-days: 7

  # Keep a completed check even when the macOS build is unnecessary.
  build:
    needs: compile_ios
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify iOS check result
        shell: bash
        env:
          BUILD_REF: ${{ github.ref }}
          BUILD_RESULT: ${{ needs.compile_ios.result }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REF" != 'refs/heads/main' ]]; then
            [[ "$BUILD_RESULT" == 'skipped' ]]
            echo 'iOS builds run only from main; simulator build was skipped.'
          else
            [[ "$BUILD_RESULT" == 'success' ]]
          fi
