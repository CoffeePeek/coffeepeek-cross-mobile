name: iOS device Debug build
run-name: iPhone Debug 2642 — languages and notifications
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-device-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      GRADLE_MAX_WORKERS: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4474d9a944dda32b73ea67444871cd10ff240794
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Prepare Debug client resource
        shell: bash
        run: |
          set -euo pipefail
          cp tools/ios/GoogleService-Info.verification.plist iosApp/iosApp/GoogleService-Info.plist
      - name: Build unsigned Debug app for physical iPhone
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-device-debug" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$(($(git rev-list --count HEAD) + 1000))" \
            build > "$RUNNER_TEMP/ios-device-debug.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-device-debug.log"
              exit 1
            }
      - name: Validate and package device app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/ios-device-debug/Build/Products/Debug-iphoneos/CoffeePeek.app"
          MINIMUM_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")
          python3 tools/ios/fix_onnx_framework.py "$APP_PATH/Frameworks/onnxruntime.framework" \
            --deployment-target "$MINIMUM_OS" --check
          python3 - "$APP_PATH" <<'PY'
          import plistlib, sys
          from pathlib import Path
          app = Path(sys.argv[1])
          with (app / "Info.plist").open("rb") as handle: info = plistlib.load(handle)
          assert {"ru", "be"} <= set(info["CFBundleLocalizations"])
          for language in ("ru", "be"):
              assert (app / (language + ".lproj") / "InfoPlist.strings").stat().st_size > 0
          checked = 0
          for values in (app / "compose-resources" / "composeResources").glob("*/values"):
              if not values.parent.name.startswith(("coffeepeek.", "com.coffeepeek.")): continue
              for resource in values.glob("*.cvr"):
                  assert (values.parent / "values-be" / resource.name).is_file(), str(resource)
                  checked += 1
          assert checked >= 40, "Missing application/feature language resources"
          print("Verified Russian and Belarusian native purpose strings and", checked, "resource pairs")
          PY
          mkdir -p "$RUNNER_TEMP/ios-device-artifacts"
          tar -czf "$RUNNER_TEMP/ios-device-artifacts/CoffeePeek-debug-iphoneos.tar.gz" \
            -C "$RUNNER_TEMP/ios-device-debug/Build/Products/Debug-iphoneos" CoffeePeek.app
          git rev-parse HEAD > "$RUNNER_TEMP/ios-device-artifacts/source-revision.txt"
          cd "$RUNNER_TEMP/ios-device-artifacts"
          shasum -a 256 CoffeePeek-debug-iphoneos.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ios-device-debug-4474d9a9
          path: ${{ runner.temp }}/ios-device-artifacts/
          if-no-files-found: error
          retention-days: 3
      - name: Run native navigation and glass configuration contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :composeApp:iosSimulatorArm64Test \
            --tests 'com.coffeepeek.admin.ui.NativeTabBarVisibilityTest' \
            --tests 'com.coffeepeek.admin.ui.component.GlassIconConfigurationTest' \
            --tests 'com.coffeepeek.admin.ui.NavigationDelegateTest' \
            --tests 'com.coffeepeek.admin.ui.TabDelegateTest' \
            > "$RUNNER_TEMP/ios-device-native-contracts.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-device-native-contracts.log"
              exit 1
            }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-device-debug-log
          path: |
            ${{ runner.temp }}/ios-device-debug.log
            ${{ runner.temp }}/ios-device-native-contracts.log
            composeApp/build/test-results/iosSimulatorArm64Test/
          retention-days: 3
