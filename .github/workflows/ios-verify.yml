name: iOS build verification

on:
  pull_request:
    branches: [main, develop, 'codex/ios-native']
    paths:
      - .github/workflows/ios-*.yml
      - build-logic/**
      - buildSrc/**
      - composeApp/**
      - core/**
      - feature/**
      - features/**
      - gradle/**
      - iosApp/**
      - iosXtool/CoffeePeek/**
      - tools/ios/**
      - tools/release/test_ios_signing_profile.py
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
      - '!**/src/android*/**'
      - '!**/proguard-rules.pro'
      - '!**/*.md'
  push:
    # Runs the verification on main so its Gradle/konan/SPM caches land in the
    # default-branch scope, which every PR branch can restore: a first push of a
    # new PR starts warm instead of paying the full cold K/N compilation.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Cache self-healing: allows deleting a poisoned SPM cache entry (gh cache delete).
  actions: write

concurrency:
  group: ios-verify-${{ github.ref }}
  # Pushes to main seed default-branch caches; cancelling one mid-run would skip
  # its cache saves, so they queue instead. PR runs still cancel superseded ones.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Same-repo PRs write caches so follow-up pushes reuse their outputs; forks stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Cache Kotlin/Native toolchain and dependency klibs
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@v4
        with:
          # xcodebuild checkouts plus the Gradle-side SPM artifacts (onnxruntime pod archive).
          path: |
            ~/SourcePackages
            build/kotlin/swiftPMCheckouts
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'feature/shelf/data/ShelfOnnxRuntime/Package.swift') }}
      - name: Validate cached SPM artifacts (onnxruntime)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPM_CACHE_KEY_PREFIX: spm-xcode-
        run: |
          set -euo pipefail
          CHECKOUTS=build/kotlin/swiftPMCheckouts
          if [ ! -d "$CHECKOUTS" ]; then echo "no restored checkouts — cold run"; exit 0; fi
          BIN=$(find "$CHECKOUTS" -type f -path '*onnxruntime.xcframework/ios-arm64_x86_64-simulator/onnxruntime.framework/onnxruntime' | head -1)
          if [ -n "$BIN" ]; then echo "cached onnxruntime simulator binary OK"; exit 0; fi
          echo "::warning::Cached SPM checkouts are incomplete — dropping them and the cache entry"
          rm -rf "$CHECKOUTS"
          KEY=$(gh cache list --key "$SPM_CACHE_KEY_PREFIX" --json key --jq '.[0].key' || true)
          if [ -n "${KEY:-}" ]; then gh cache delete "$KEY" || true; fi
      - name: Check CI configuration and prepare unsigned Firebase resource
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/ios -p 'test_*.py'
          python3 -m unittest discover -s tools/release -p test_ios_signing_profile.py
          cp tools/ios/GoogleService-Info.verification.plist iosApp/iosApp/GoogleService-Info.plist

      - name: Compile iPhone launch catalog for xtool
        shell: bash
        run: bash iosXtool/CoffeePeek/prepare-launch-resources.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ios-launch-resources
          path: iosXtool/CoffeePeek/.build/launch-resources/Assets.car
          if-no-files-found: error
          retention-days: 7

      - name: Compile Kotlin and native Swift for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-verify" \
            -clonedSourcePackagesDirPath "$HOME/SourcePackages" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-verify.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-verify.log"
              exit 1
            }
      - name: Verify iOS binary compatibility
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/ios-verify/Build/Products/Debug-iphonesimulator/CoffeePeek.app"
          MINIMUM_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")
          EXPECTED_MINIMUM_OS=$(sed -n 's/^IPHONEOS_DEPLOYMENT_TARGET = //p' iosApp/Configuration/Shared.xcconfig)
          [[ "$MINIMUM_OS" == "$EXPECTED_MINIMUM_OS" ]]
          python3 tools/ios/fix_onnx_framework.py "$APP_PATH/Frameworks/onnxruntime.framework" \
            --deployment-target "$MINIMUM_OS" --check
          bash tools/ios/verify_liquid_glass_imports.sh "$APP_PATH"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-build-log
          path: |
            ${{ runner.temp }}/ios-verify.log
            iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 7

  # Runs next to the app build instead of after it: the K/N test binaries compile on their
  # own runner, so the wall time is max(build, tests) rather than their sum.
  kotlin-native-tests:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Same-repo PRs write caches so follow-up pushes reuse their outputs; forks stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Cache Kotlin/Native toolchain and dependency klibs
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Cache Swift Package Manager checkouts
        uses: actions/cache@v4
        with:
          # The Gradle-side SPM artifacts (onnxruntime pod archive) used by iosMain compilation.
          path: build/kotlin/swiftPMCheckouts
          key: spm-gradle-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'feature/shelf/data/ShelfOnnxRuntime/Package.swift') }}
      - name: Validate cached SPM artifacts (onnxruntime)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPM_CACHE_KEY_PREFIX: spm-gradle-
        run: |
          set -euo pipefail
          CHECKOUTS=build/kotlin/swiftPMCheckouts
          if [ ! -d "$CHECKOUTS" ]; then echo "no restored checkouts — cold run"; exit 0; fi
          BIN=$(find "$CHECKOUTS" -type f -path '*onnxruntime.xcframework/ios-arm64_x86_64-simulator/onnxruntime.framework/onnxruntime' | head -1)
          if [ -n "$BIN" ]; then echo "cached onnxruntime simulator binary OK"; exit 0; fi
          echo "::warning::Cached SPM checkouts are incomplete — dropping them and the cache entry"
          rm -rf "$CHECKOUTS"
          KEY=$(gh cache list --key "$SPM_CACHE_KEY_PREFIX" --json key --jq '.[0].key' || true)
          if [ -n "${KEY:-}" ]; then gh cache delete "$KEY" || true; fi
      - name: Run Kotlin Native contract tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :composeApp:iosSimulatorArm64Test \
            --tests 'com.coffeepeek.admin.di.KoinViewModelCompatibilityTest' \
            --tests 'com.coffeepeek.admin.AppLinkHandlingTest' \
            --tests 'com.coffeepeek.admin.ui.AppLinksTest' \
            --tests 'com.coffeepeek.admin.ui.ShopCheckInSignInHandoffTest' \
            --tests 'com.coffeepeek.admin.di.homecheckin.IosCheckInCreatePickerTest' \
            --tests 'com.coffeepeek.admin.di.shop.ShopBrowsingHostViewModelTest' \
            --tests 'com.coffeepeek.admin.di.shop.ShopBrowsingSessionTest' \
            --tests 'com.coffeepeek.admin.di.shop.ShopAuthorBlockBridgeTest' \
            --tests 'com.coffeepeek.admin.di.auth.IosCheckInAuthFlowTest' \
            --tests 'com.coffeepeek.admin.di.profile.IosProfileCompositionTest' \
            --tests 'com.coffeepeek.admin.di.settings.IosThemeSettingsTest' \
            --tests 'com.coffeepeek.admin.di.system.IosGlobalDialogTest' \
            --tests 'com.coffeepeek.admin.di.system.IosRootModalsTest' \
            --tests 'com.coffeepeek.admin.di.contributions.IosContributionFormsTest' \
            --tests 'com.coffeepeek.admin.di.coffee.IosCoffeeDetailAnalyticsTest' \
            --tests 'com.coffeepeek.admin.di.media.IosPhotoViewerTest' \
            --tests 'com.coffeepeek.admin.di.media.IosCatalogueMediaTest' \
            --tests 'com.coffeepeek.admin.di.community.IosCommunityMessageTest' \
            --tests 'com.coffeepeek.admin.ui.RootNavigationSessionTest' \
            --tests 'com.coffeepeek.admin.di.roaster.IosRoasterLifetimeTest' \
            --tests 'com.coffeepeek.admin.di.shopreport.IosShopReportTest' \
            --tests 'com.coffeepeek.admin.di.contentreport.IosContentReportTest' \
            --tests 'com.coffeepeek.admin.di.settings.IosSettingsScreensTest' \
            --tests 'com.coffeepeek.admin.di.authorblocking.IosBlockedAuthorsTest' \
            --tests 'com.coffeepeek.admin.ui.NavigationDelegateTest' \
            --tests 'com.coffeepeek.admin.ui.MainTabReselectionsTest' \
            --tests 'com.coffeepeek.admin.ui.TabDelegateTest' \
            --tests 'com.coffeepeek.admin.di.shelf.IosShelfModuleTest' \
            --tests 'com.coffeepeek.admin.ui.NativeTabBarVisibilityTest' \
            --tests 'com.coffeepeek.admin.ui.component.GlassIconConfigurationTest' \
            > "$RUNNER_TEMP/ios-native-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-native-tests.log"
              exit 1
            }
      - name: Run authentication Kotlin Native tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :feature:auth:impl:iosSimulatorArm64Test \
            > "$RUNNER_TEMP/ios-auth-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-auth-tests.log"
              exit 1
            }
      - name: Run shop Kotlin Native tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :feature:shop:impl:iosSimulatorArm64Test \
            --tests 'com.coffeepeek.feature.shop.impl.ui.ShopMenuGallery*Test' \
            --tests 'com.coffeepeek.feature.shop.impl.ui.ShopCheckInListViewModelTest' \
            --tests 'com.coffeepeek.feature.shop.impl.IosShopCheckInListPresentationTest' \
            > "$RUNNER_TEMP/ios-shop-menu-gallery-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-shop-menu-gallery-tests.log"
              exit 1
            }
      - name: Run coffee details Kotlin Native tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :feature:coffee:impl:iosSimulatorArm64Test \
            --tests 'com.coffeepeek.feature.coffee.impl.ui.CoffeeDetailViewModelTest' \
            --tests 'com.coffeepeek.feature.coffee.impl.CoffeeDetailIosSessionTest' \
            > "$RUNNER_TEMP/ios-coffee-detail-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-coffee-detail-tests.log"
              exit 1
            }
      - name: Run notification inbox Kotlin Native tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :feature:notifications:impl:iosSimulatorArm64Test \
            > "$RUNNER_TEMP/ios-notification-inbox-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-notification-inbox-tests.log"
              exit 1
            }
      - name: Run Discovery filter Kotlin Native tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :feature:discovery:impl:iosSimulatorArm64Test \
            --tests 'com.coffeepeek.feature.discovery.impl.ui.IosDiscoveryFilterDraftTest' \
            --tests 'com.coffeepeek.feature.discovery.impl.SearchViewModelTest' \
            > "$RUNNER_TEMP/ios-discovery-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-discovery-tests.log"
              exit 1
            }
      - name: Run design-system Kotlin Native contracts
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :core:design-system:iosSimulatorArm64Test \
            > "$RUNNER_TEMP/ios-design-system-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-design-system-tests.log"
              exit 1
            }
      - name: Run own profile and calendar Kotlin Native tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :feature:profile:impl:iosSimulatorArm64Test \
            --tests 'com.coffeepeek.feature.profile.impl.IosOwnProfileSessionTest' \
            --tests 'com.coffeepeek.feature.profile.impl.IosPublicProfileSessionTest' \
            --tests 'com.coffeepeek.feature.profile.impl.NativeAccountDeletionSessionTest' \
            --tests 'com.coffeepeek.feature.profile.impl.ui.AccountDeletionViewModelTest' \
            --tests 'com.coffeepeek.feature.profile.impl.ui.data.PublicProfileWeekTest' \
            --tests 'com.coffeepeek.feature.profile.impl.ui.OwnProfileViewModelTest' \
            --tests 'com.coffeepeek.feature.profile.impl.ui.PublicProfileViewModelTest' \
            :feature:check-in-history:impl:iosSimulatorArm64Test \
            --tests 'com.coffeepeek.feature.checkinhistory.impl.ui.CombinedHistoryViewModelTest' \
            --tests 'com.coffeepeek.feature.checkinhistory.impl.ui.ProfileActivityViewModelTest' \
            --tests 'com.coffeepeek.feature.checkinhistory.impl.ui.data.ProfileActivityDatesTest' \
            > "$RUNNER_TEMP/ios-own-profile-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-own-profile-tests.log"
              exit 1
            }
      - name: Run roaster Kotlin Native tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :feature:roaster:impl:iosSimulatorArm64Test \
            > "$RUNNER_TEMP/ios-roaster-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-roaster-tests.log"
              exit 1
            }
      - name: Run shelf Kotlin Native tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :feature:shelf:impl:iosSimulatorArm64Test \
            --tests 'com.coffeepeek.feature.shelf.impl.*' \
            > "$RUNNER_TEMP/ios-shelf-archive-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-shelf-archive-tests.log"
              exit 1
            }
      - name: Run shared business ownership unit and contract tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --max-workers=6 :feature:business-ownership:domain:iosSimulatorArm64Test \
            :feature:business-ownership:data:iosSimulatorArm64Test \
            :feature:business-ownership:impl:iosSimulatorArm64Test \
            :feature:contributions:impl:iosSimulatorArm64Test \
            :feature:shop-report:impl:iosSimulatorArm64Test \
            :feature:collections:impl:iosSimulatorArm64Test \
            > "$RUNNER_TEMP/ios-ownership-tests.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-ownership-tests.log"
              exit 1
            }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-tests-log
          path: |
            ${{ runner.temp }}/ios-native-tests.log
            ${{ runner.temp }}/ios-ownership-tests.log
            feature/business-ownership/**/build/test-results/iosSimulatorArm64Test/
            feature/contributions/impl/build/test-results/iosSimulatorArm64Test/
            feature/collections/impl/build/test-results/iosSimulatorArm64Test/
            ${{ runner.temp }}/ios-shelf-archive-tests.log
            feature/shelf/impl/build/test-results/iosSimulatorArm64Test/
            composeApp/build/test-results/iosSimulatorArm64Test/
            ${{ runner.temp }}/ios-shop-menu-gallery-tests.log
            feature/shop/impl/build/test-results/iosSimulatorArm64Test/
            ${{ runner.temp }}/ios-roaster-tests.log
            feature/roaster/impl/build/test-results/iosSimulatorArm64Test/
            ${{ runner.temp }}/ios-coffee-detail-tests.log
            feature/coffee/impl/build/test-results/iosSimulatorArm64Test/
            ${{ runner.temp }}/ios-notification-inbox-tests.log
            feature/notifications/impl/build/test-results/iosSimulatorArm64Test/
            ${{ runner.temp }}/ios-discovery-tests.log
            feature/discovery/impl/build/test-results/iosSimulatorArm64Test/
            ${{ runner.temp }}/ios-own-profile-tests.log
            feature/profile/impl/build/test-results/iosSimulatorArm64Test/
              ${{ runner.temp }}/ios-design-system-tests.log
              core/design-system/build/test-results/iosSimulatorArm64Test/
            feature/check-in-history/impl/build/test-results/iosSimulatorArm64Test/
            ${{ runner.temp }}/ios-auth-tests.log
            feature/auth/impl/build/test-results/iosSimulatorArm64Test/
          retention-days: 7
