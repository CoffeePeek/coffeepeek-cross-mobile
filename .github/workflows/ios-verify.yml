name: iOS build verification

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/ios-verify.yml
      - composeApp/src/**/auth/**
      - iosApp/**
      - iosXtool/CoffeePeek/Sources/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile Kotlin and native Swift for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-verify" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ios-verify.log" 2>&1 || {
              tail -n 150 "$RUNNER_TEMP/ios-verify.log"
              exit 1
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-verify.log
          retention-days: 7
