name: iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios-testflight.yml
      - build-logic/**
      - buildSrc/**
      - composeApp/**
      - core/**
      - feature/**
      - features/**
      - gradle/**
      - modules/**
      - iosApp/**
      - iosXtool/CoffeePeek/Sources/**
      - tools/ios/**
      - tools/release/test_ios_signing_profile.py
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
      - tools/release/test_versioning.py
      - '!**/src/android*/**'
      - '!**/proguard-rules.pro'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: testflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release versioning
        run: python3 -m unittest discover -s tools/release -p 'test_versioning.py' -v

      - name: Read build number from commit history
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER_OFFSET=$(sed -n 's/^BUILD_NUMBER_OFFSET = //p' iosApp/Configuration/Shared.xcconfig)
          [[ "$BUILD_NUMBER_OFFSET" =~ ^[0-9]+$ ]]
          echo "IOS_BUILD_NUMBER=$((BUILD_NUMBER_OFFSET + COMMIT_COUNT))" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Configure Firebase Messaging for iOS
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/ios -p 'test_*.py'
          python3 tools/ios/restore_firebase_config.py

      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          [[ "$(xcodebuild -version | head -n 1)" == Xcode\ 27* ]]
          java -version
          test -d "$ANDROID_HOME/platforms/android-37.0"

      - name: Validate release configuration
        shell: bash
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL_MAIN }}
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          required = (
              'API_BASE_URL',
              'GOOGLE_IOS_CLIENT_ID', 'GOOGLE_WEB_CLIENT_ID', 'GOOGLE_REVERSED_CLIENT_ID',
              'IOS_CERTIFICATE_BASE64',
              'IOS_CERTIFICATE_PASSWORD',
              'IOS_PROVISIONING_PROFILE_BASE64', 'APPSTORE_API_KEY_ID',
              'APPSTORE_ISSUER_ID', 'APPSTORE_API_PRIVATE_KEY',
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing TestFlight configuration: ' + ', '.join(missing))

          if not re.fullmatch(r'[A-Z0-9]{10}', os.environ['APPSTORE_API_KEY_ID']):
              raise SystemExit('APPSTORE_API_KEY_ID must be a 10-character key ID')
          if not re.fullmatch(r'[0-9A-Fa-f-]{36}', os.environ['APPSTORE_ISSUER_ID']):
              raise SystemExit('APPSTORE_ISSUER_ID must be a UUID')

          url = os.environ['API_BASE_URL']
          parsed = urlsplit(url)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.username or parsed.password or parsed.query or parsed.fragment or any(c.isspace() for c in url) or '//' in url[len('https://'):] or any(c in url for c in '#$\\'):
              raise SystemExit('API_BASE_URL_MAIN must be a plain HTTPS URL')

          oauth_values = (
              'GOOGLE_IOS_CLIENT_ID', 'GOOGLE_WEB_CLIENT_ID',
              'GOOGLE_REVERSED_CLIENT_ID',
          )
          configured = oauth_values
          if any(not re.fullmatch(r'[A-Za-z0-9._-]+', os.environ[name]) for name in configured):
              raise SystemExit('Google OAuth IDs contain invalid xcconfig characters')
          client_id_pattern = re.compile(r'(?P<project>[0-9]+)-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com')
          project_numbers = {}
          for name in oauth_values[:2]:
              match = client_id_pattern.fullmatch(os.environ[name])
              if not match:
                  raise SystemExit(name + ' must be a Google OAuth client ID with a numeric project prefix')
              project_numbers[name] = match.group('project')
          print('Google OAuth project numbers: iOS=' + project_numbers['GOOGLE_IOS_CLIENT_ID'] +
                ', Web=' + project_numbers['GOOGLE_WEB_CLIENT_ID'])
          if os.environ['GOOGLE_IOS_CLIENT_ID'] == os.environ['GOOGLE_WEB_CLIENT_ID']:
              raise SystemExit('GOOGLE_IOS_CLIENT_ID and GOOGLE_WEB_CLIENT_ID must be different OAuth clients')
          if project_numbers['GOOGLE_IOS_CLIENT_ID'] != project_numbers['GOOGLE_WEB_CLIENT_ID']:
              raise SystemExit('GOOGLE_IOS_CLIENT_ID and GOOGLE_WEB_CLIENT_ID must belong to the same Google Cloud project')
          if os.environ['GOOGLE_REVERSED_CLIENT_ID'] != '.'.join(reversed(os.environ['GOOGLE_IOS_CLIENT_ID'].split('.'))):
              raise SystemExit('GOOGLE_REVERSED_CLIENT_ID must correspond to GOOGLE_IOS_CLIENT_ID')

          # In xcconfig, // starts a comment. $() inserts an empty value.
          posthog_token = os.environ.get('POSTHOG_PROJECT_TOKEN', '').strip()
          if posthog_token and not re.fullmatch(r'phc_[A-Za-z0-9_-]+', posthog_token):
              raise SystemExit('POSTHOG_PROJECT_TOKEN must be a PostHog project ingestion token')
          with open('iosApp/Configuration/Local.xcconfig', 'w', encoding='utf-8') as config:
              config.write('POSTHOG_PROJECT_TOKEN = ' + posthog_token + '\n')
              config.write('API_BASE_URL = https:/$()/' + url[len('https://'):] + '\n')
              for name in configured:
                  config.write(name + ' = ' + os.environ[name] + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('IOS_API_BASE_URL=' + url + '\n')
          PY

      - name: Install Apple signing assets
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 -m unittest discover -s tools/release -p test_ios_signing_profile.py
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/app-store.mobileprovision"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          if ! openssl pkey -in "$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8" -noout >/dev/null 2>&1; then
            echo '::error::APPSTORE_API_PRIVATE_KEY must contain the raw multiline AuthKey_*.p8 PEM text, not Base64 or literal \n characters.'
            exit 1
          fi
          if ! openssl pkcs12 -legacy -in "$RUNNER_TEMP/distribution.p12" -passin env:IOS_CERTIFICATE_PASSWORD -noout >/dev/null 2>&1; then
            echo '::error::IOS_CERTIFICATE_BASE64 must contain the Base64 bytes of a readable .p12 file, and IOS_CERTIFICATE_PASSWORD must match its export password.'
            exit 1
          fi
          if ! openssl pkcs12 -legacy -in "$RUNNER_TEMP/distribution.p12" -passin env:IOS_CERTIFICATE_PASSWORD -nocerts -nodes 2>/dev/null | openssl pkey -noout >/dev/null 2>&1; then
            echo '::error::The .p12 file in IOS_CERTIFICATE_BASE64 must include the Apple Distribution private key.'
            exit 1
          fi
          security cms -D -i "$RUNNER_TEMP/app-store.mobileprovision" > "$RUNNER_TEMP/profile.plist"

          python3 - <<'PY'
          import datetime
          import os
          import plistlib
          import re
          from pathlib import Path

          with open(Path(os.environ['RUNNER_TEMP']) / 'profile.plist', 'rb') as file:
              profile = plistlib.load(file)
          teams = profile.get('TeamIdentifier', [])
          if len(teams) != 1 or not re.fullmatch(r'[A-Z0-9]{10}', teams[0]):
              raise SystemExit('Provisioning profile has an invalid Apple team ID')
          team = teams[0]
          if profile.get('Entitlements', {}).get('application-identifier') != team + '.com.coffeepeek':
              raise SystemExit('Provisioning profile does not match com.coffeepeek')
          if 'Default' not in profile.get('Entitlements', {}).get('com.apple.developer.applesignin', []):
              raise SystemExit('Regenerate the App Store profile with Sign in with Apple and update IOS_PROVISIONING_PROFILE_BASE64')
          if profile.get('Entitlements', {}).get('aps-environment') != 'production':
              raise SystemExit('Regenerate the App Store profile with Push Notifications enabled and update IOS_PROVISIONING_PROFILE_BASE64')
          associated_domains = profile.get('Entitlements', {}).get('com.apple.developer.associated-domains', [])
          if associated_domains != '*' and not (
              isinstance(associated_domains, list)
              and any(domain in associated_domains for domain in ('*', 'applinks:coffeepeek.by'))
          ):
              raise SystemExit('Regenerate the App Store profile with Associated Domains enabled and update IOS_PROVISIONING_PROFILE_BASE64')
          if profile.get('Entitlements', {}).get('get-task-allow') is not False or 'ProvisionedDevices' in profile or profile.get('ProvisionsAllDevices'):
              raise SystemExit('An App Store distribution profile is required')
          if profile['ExpirationDate'] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise SystemExit('Provisioning profile has expired')
          uuid = profile['UUID']
          name = profile['Name']
          if not re.fullmatch(r'[0-9A-Fa-f-]{36}', uuid) or '\n' in name or '\r' in name:
              raise SystemExit('Invalid provisioning profile metadata')
          destination = Path.home() / 'Library/MobileDevice/Provisioning Profiles' / (uuid + '.mobileprovision')
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_bytes((Path(os.environ['RUNNER_TEMP']) / 'app-store.mobileprovision').read_bytes())
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('APPLE_TEAM_ID=' + team + '\n')
              output.write('IOS_PROFILE_NAME=' + name + '\n')
              output.write('IOS_PROFILE_PATH=' + str(destination) + '\n')
          # Shared.xcconfig includes this file only for the iosApp target.
          # Command-line signing settings would also affect Swift packages.
          with open('iosApp/Configuration/Local.xcconfig', 'a', encoding='utf-8') as config:
              config.write('CODE_SIGN_IDENTITY = Apple Distribution\n')
              config.write('PROVISIONING_PROFILE_SPECIFIER = ' + uuid + '\n')
              config.write('CURRENT_PROJECT_VERSION = ' + os.environ['IOS_BUILD_NUMBER'] + '\n')
          PY

          KEYCHAIN_PATH="$RUNNER_TEMP/coffeepeek.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -f pkcs12 -k "$KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution:'

      - name: Verify App Store Connect access
        shell: bash
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'base64'
          require 'json'
          require 'net/http'
          require 'openssl'
          require 'uri'

          key_id = ENV.fetch('APPSTORE_API_KEY_ID')
          issuer_id = ENV.fetch('APPSTORE_ISSUER_ID')
          key_path = File.join(ENV.fetch('RUNNER_TEMP'), "AuthKey_#{key_id}.p8")
          key = OpenSSL::PKey.read(File.read(key_path))
          abort '::error::APPSTORE_API_PRIVATE_KEY must be an App Store Connect EC P-256 .p8 key.' unless key.is_a?(OpenSSL::PKey::EC) && key.group.curve_name == 'prime256v1'
          now = Time.now.to_i
          encode = ->(value) { Base64.urlsafe_encode64(JSON.generate(value), padding: false) }
          unsigned = [
            encode.call({ alg: 'ES256', kid: key_id, typ: 'JWT' }),
            encode.call({ iss: issuer_id, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' }),
          ].join('.')
          signature = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, unsigned))
          raw_signature = signature.value.map do |integer|
            hex = integer.value.to_i.to_s(16).rjust(64, '0')
            raise 'Invalid ES256 signature' unless hex.length == 64
            [hex].pack('H*')
          end.join
          raise 'Invalid ES256 signature' unless raw_signature.bytesize == 64
          token = unsigned + '.' + Base64.urlsafe_encode64(raw_signature, padding: false)

          query = URI.encode_www_form('filter[bundleId]' => 'com.coffeepeek', 'fields[apps]' => 'bundleId', 'limit' => '1')
          uri = URI("https://api.appstoreconnect.apple.com/v1/apps?#{query}")
          request = Net::HTTP::Get.new(uri)
          request['Authorization'] = "Bearer #{token}"
          response = Net::HTTP.start(uri.host, uri.port, use_ssl: true, open_timeout: 10, read_timeout: 20) do |http|
            http.request(request)
          end

          case response.code.to_i
          when 200
            apps = JSON.parse(response.body).fetch('data')
            abort '::error::API key is valid, but com.coffeepeek is absent from this App Store Connect team.' unless apps.any? { |app| app.dig('attributes', 'bundleId') == 'com.coffeepeek' }
            puts 'App Store Connect API key can access com.coffeepeek.'
          when 401
            abort '::error::App Store Connect rejected the API key (401). Check that Key ID, Issuer ID and .p8 belong to the same active Team API key.'
          when 403
            abort '::error::App Store Connect accepted the API key but denied app access (403). Check the API key role and team.'
          else
            abort "::error::App Store Connect API preflight returned HTTP #{response.code}; retry when Apple is available."
          end
          RUBY

      - name: Archive signed iOS app
        shell: bash
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          GRADLE_MAX_WORKERS: '1'
        run: |
          set -euo pipefail
          # Kotlin/Native links the release framework in a separate JVM.
          # Release binary caches avoid optimizing every dependency in one LTO graph.
          # Keep these settings scoped to TestFlight CI.
          printf '\nkotlin.native.jvmArgs=-Xmx5g\nkotlin.native.binary.enableReleaseBinaryCache=true\nkotlin.internal.native.enableReleaseBinaryCache=true\n' >> gradle.properties
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CoffeePeek.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual

      - name: Verify archive configuration
        shell: bash
        run: |
          set -euo pipefail
          INFO_PLIST="$RUNNER_TEMP/CoffeePeek.xcarchive/Products/Applications/CoffeePeek.app/Info.plist"
          test -f "$INFO_PLIST"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")" == 'com.coffeepeek' ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" == "$IOS_BUILD_NUMBER" ]]
          EXPECTED_VERSION=$(sed -n 's/^MARKETING_VERSION = //p' iosApp/Configuration/Shared.xcconfig)
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" == "$EXPECTED_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :APIBaseURL' "$INFO_PLIST")" == "$IOS_API_BASE_URL" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CoffeePeekDebug' "$INFO_PLIST")" == 'NO' ]]
          APP_PATH="${INFO_PLIST%/Info.plist}"
          MINIMUM_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$INFO_PLIST")
          python3 tools/ios/fix_onnx_framework.py "$APP_PATH/Frameworks/onnxruntime.framework" \
            --deployment-target "$MINIMUM_OS" --check
          codesign --verify --deep --strict "$APP_PATH"

      - name: Upload to App Store Connect
        shell: bash
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              'method': 'app-store-connect',
              'destination': 'upload',
              'signingStyle': 'manual',
              'signingCertificate': 'Apple Distribution',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'provisioningProfiles': {'com.coffeepeek': os.environ['IOS_PROFILE_NAME']},
              'manageAppVersionAndBuildNumber': False,
              'uploadSymbols': True,
          }
          with open(Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist', 'wb') as file:
              plistlib.dump(options, file)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CoffeePeek.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlight" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${APPSTORE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

          {
            echo '### Uploaded to App Store Connect'
            echo ''
            echo "- Bundle ID: com.coffeepeek"
            echo "- Build: $IOS_BUILD_NUMBER"
            echo '- Apple must process the build before it appears in TestFlight.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing assets
        if: always()
        shell: bash
        run: |
          if [[ -n "${IOS_PROFILE_PATH:-}" ]]; then
            rm -f "$IOS_PROFILE_PATH"
          fi
          security delete-keychain "$RUNNER_TEMP/coffeepeek.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app-store.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP"/AuthKey_*.p8
          rm -f iosApp/Configuration/Local.xcconfig
