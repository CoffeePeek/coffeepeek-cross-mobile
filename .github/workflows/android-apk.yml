name: Android Release

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_apk:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      release_dir: ${{ steps.meta.outputs.release_dir }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      size: ${{ steps.meta.outputs.size }}
      released_at: ${{ steps.meta.outputs.released_at }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install Android 37 SDK components
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Validate branch and build configuration
        shell: bash
        env:
          API_BASE_URL_MAIN: ${{ vars.API_BASE_URL_MAIN }}
          API_BASE_URL_DEV: ${{ vars.API_BASE_URL_DEV }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          case "$GITHUB_REF_NAME" in
            main) API_BASE_URL="$API_BASE_URL_MAIN" ;;
            develop) API_BASE_URL="$API_BASE_URL_DEV" ;;
            *) echo "Unsupported release branch: $GITHUB_REF_NAME"; exit 1 ;;
          esac

          if [[ -z "$API_BASE_URL" ]]; then
            echo "The API base URL variable for $GITHUB_REF_NAME is empty."
            exit 1
          fi

          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Required Android signing secret $value is empty."
              exit 1
            fi
          done

          {
            echo "API_BASE_URL=$API_BASE_URL"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
          } > local.properties

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coffeepeek-release.jks"

      - name: Run Android checks
        run: ./gradlew --no-daemon testDebugUnitTest :composeApp:testDirectDebugUnitTest :composeApp:testPlayDebugUnitTest lintDebug :composeApp:lintDirectDebug :composeApp:lintPlayDebug

      - name: Build signed release artifacts
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/coffeepeek-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          tasks=(:composeApp:assembleDirectRelease)
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            tasks+=(:composeApp:bundlePlayRelease)
          fi
          ./gradlew --no-daemon --no-configuration-cache "${tasks[@]}"

      - name: Prepare and verify APK metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(composeApp/build/outputs/apk/direct/release/*.apk)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one release APK, found ${#files[@]}."
            exit 1
          fi

          APK_PATH="${files[0]}"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [[ ! -x "$APKSIGNER" ]]; then
            echo "apksigner was not found at $APKSIGNER."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          VERSION_NAME=$(./gradlew -q :composeApp:printVersionName)
          VERSION_CODE=$(./gradlew -q :composeApp:printVersionCode)
          if [[ ! "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Unsafe version name: $VERSION_NAME"
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Invalid version code: $VERSION_CODE"
            exit 1
          fi

          CHANNEL="$GITHUB_REF_NAME"
          RELEASE_DIR="${VERSION_NAME}-${VERSION_CODE}"
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$APK_PATH")
          RELEASED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          cp "$APK_PATH" coffeepeek.apk

          {
            echo "channel=$CHANNEL"
            echo "release_dir=$RELEASE_DIR"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "sha256=$SHA256"
            echo "size=$SIZE"
            echo "released_at=$RELEASED_AT"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffeepeek-apk-${{ github.run_id }}
          path: coffeepeek.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify and stage AAB and mapping
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(composeApp/build/outputs/bundle/playRelease/*.aab)
          [[ ${#bundles[@]} -eq 1 ]]
          jarsigner -verify -certs "${bundles[0]}"
          mkdir -p dist
          cp "${bundles[0]}" dist/coffeepeek-release.aab
          cp composeApp/build/outputs/mapping/playRelease/mapping.txt dist/mapping.txt

      - name: Upload Play artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coffeepeek-play-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish_play:
    needs: build_apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Play credentials
        shell: bash
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$SERVICE_ACCOUNT_JSON" | jq -e '.type == "service_account" and (.client_email | length > 0) and (.private_key | length > 0)' >/dev/null

      - name: Download Play artifacts
        uses: actions/download-artifact@v4
        with:
          name: coffeepeek-play-${{ github.run_id }}
          path: dist

      - name: Publish to Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.coffeepeek
          releaseFiles: dist/coffeepeek-release.aab
          mappingFile: dist/mapping.txt
          tracks: internal
          status: completed
          releaseName: ${{ needs.build_apk.outputs.version_name }}

  publish_firebase:
    needs: build_apk
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Firebase credentials
        shell: bash
        env:
          APP_ID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          set -euo pipefail
          [[ -n "$APP_ID" ]]
          [[ -n "$TESTER_GROUPS" || -n "$TESTERS" ]]
          printf '%s' "$SERVICE_ACCOUNT_JSON" | jq -e '.type == "service_account"' >/dev/null

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: coffeepeek-apk-${{ github.run_id }}
          path: artifacts

      - name: Distribute APK to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          testers: ${{ secrets.FIREBASE_TESTERS }}
          file: artifacts/coffeepeek.apk
          releaseNotes: ${{ needs.build_apk.outputs.version_name }} (${{ github.sha }})

  publish_apk:
    needs: build_apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://coffeepeek.by/downloads/android/${{ needs.build_apk.outputs.channel }}/coffeepeek.apk

    steps:
      - name: Validate VPS secrets
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          for value in VPS_HOST VPS_USER VPS_SSH_KEY VPS_SSH_FINGERPRINT; do
            if [[ -z "${!value}" ]]; then
              echo "Required VPS secret $value is empty."
              exit 1
            fi
          done

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: coffeepeek-apk-${{ github.run_id }}
          path: artifacts

      - name: Upload APK to VPS staging directory
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          source: artifacts/coffeepeek.apk
          target: /tmp/coffeepeek-apk-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish stable and immutable APK
        uses: appleboy/ssh-action@v1
        env:
          CHANNEL: ${{ needs.build_apk.outputs.channel }}
          RELEASE_DIR: ${{ needs.build_apk.outputs.release_dir }}
          EXPECTED_SHA256: ${{ needs.build_apk.outputs.sha256 }}
          EXPECTED_SIZE: ${{ needs.build_apk.outputs.size }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: CHANNEL,RELEASE_DIR,EXPECTED_SHA256,EXPECTED_SIZE,RUN_ID,RUN_ATTEMPT
          script: |
            set -eu

            ROOT=/var/www/coffeepeek-downloads/android
            UPLOAD_DIR="/tmp/coffeepeek-apk-$RUN_ID-$RUN_ATTEMPT"
            APK=$(find "$UPLOAD_DIR" -type f -name coffeepeek.apk -print -quit)
            if [ -z "$APK" ]; then
              echo "Uploaded APK was not found."
              exit 1
            fi

            cleanup() {
              rm -rf "$UPLOAD_DIR"
            }
            trap cleanup EXIT

            verify_file() {
              FILE=$1
              ACTUAL_SHA256=$(sha256sum "$FILE" | awk '{print $1}')
              ACTUAL_SIZE=$(stat -c '%s' "$FILE")
              [ "$ACTUAL_SHA256" = "$EXPECTED_SHA256" ] && [ "$ACTUAL_SIZE" = "$EXPECTED_SIZE" ]
            }

            CHANNEL_DIR="$ROOT/$CHANNEL"
            VERSION_DIR="$ROOT/releases/$RELEASE_DIR"
            STABLE_FILE="$CHANNEL_DIR/coffeepeek.apk"
            VERSION_FILE="$VERSION_DIR/coffeepeek.apk"

            install -d -m 0755 "$CHANNEL_DIR" "$VERSION_DIR"

            VERSION_TMP="$VERSION_DIR/.coffeepeek-$RUN_ID-$RUN_ATTEMPT.tmp"
            install -m 0644 "$APK" "$VERSION_TMP"
            if ! verify_file "$VERSION_TMP"; then
              echo "Versioned APK checksum verification failed."
              exit 1
            fi

            if ! ln "$VERSION_TMP" "$VERSION_FILE" 2>/dev/null; then
              if ! verify_file "$VERSION_FILE"; then
                echo "Immutable release $RELEASE_DIR already exists with different content."
                exit 1
              fi
            fi
            rm -f "$VERSION_TMP"

            STABLE_TMP="$CHANNEL_DIR/.coffeepeek-$RUN_ID-$RUN_ATTEMPT.tmp"
            install -m 0644 "$APK" "$STABLE_TMP"
            if ! verify_file "$STABLE_TMP"; then
              echo "Stable APK checksum verification failed."
              exit 1
            fi
            mv -f "$STABLE_TMP" "$STABLE_FILE"

      - name: Register production release in CoffeePeek
        if: needs.build_apk.outputs.channel == 'main'
        shell: bash
        env:
          ADMIN_API_URL: ${{ secrets.COFFEEPEEK_ADMIN_API_URL }}
          ADMIN_TOKEN: ${{ secrets.COFFEEPEEK_ADMIN_TOKEN }}
          VERSION_NAME: ${{ needs.build_apk.outputs.version_name }}
          VERSION_CODE: ${{ needs.build_apk.outputs.version_code }}
          RELEASE_DIR: ${{ needs.build_apk.outputs.release_dir }}
          FILE_SIZE: ${{ needs.build_apk.outputs.size }}
          SHA256: ${{ needs.build_apk.outputs.sha256 }}
          RELEASED_AT: ${{ needs.build_apk.outputs.released_at }}
        run: |
          set -euo pipefail

          if [[ -z "$ADMIN_API_URL" || -z "$ADMIN_TOKEN" ]]; then
            echo "COFFEEPEEK_ADMIN_API_URL and COFFEEPEEK_ADMIN_TOKEN are required for main releases."
            exit 1
          fi

          API_URL="${ADMIN_API_URL%/}/api/admin/v1/app-downloads/android/releases"
          FILE_URL="https://coffeepeek.by/downloads/android/releases/$RELEASE_DIR/coffeepeek.apk"
          AUTH_HEADER="Authorization: Bearer $ADMIN_TOKEN"

          curl --fail --silent --show-error --location --head "$FILE_URL" >/dev/null

          RELEASES=$(curl --fail --silent --show-error \
            --header "$AUTH_HEADER" \
            --header "Accept: application/json" \
            "$API_URL")

          EXISTING=$(jq -c --argjson code "$VERSION_CODE" \
            '(.data // .Data // [])
             | map(select((.versionCode // .VersionCode) == $code))
             | first // empty' <<< "$RELEASES")

          if [[ -n "$EXISTING" ]]; then
            jq -e \
              --arg version "$VERSION_NAME" \
              --arg url "$FILE_URL" \
              --arg sha "$SHA256" \
              --argjson size "$FILE_SIZE" \
              '(.version // .Version) == $version
               and (.fileUrl // .FileUrl) == $url
               and (.fileName // .FileName) == "coffeepeek.apk"
               and (.fileSize // .FileSize) == $size
               and ((.sha256 // .Sha256) | ascii_downcase) == ($sha | ascii_downcase)' \
              <<< "$EXISTING" >/dev/null || {
                echo "Version code $VERSION_CODE is already registered with different metadata."
                exit 1
              }
            echo "Version code $VERSION_CODE is already registered with matching metadata."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg version "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg fileUrl "$FILE_URL" \
            --arg fileName "coffeepeek.apk" \
            --argjson fileSize "$FILE_SIZE" \
            --arg sha256 "$SHA256" \
            --arg releasedAt "$RELEASED_AT" \
            '{version: $version, versionCode: $versionCode, fileUrl: $fileUrl,
              fileName: $fileName, fileSize: $fileSize, sha256: $sha256,
              releasedAt: $releasedAt}')

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "$AUTH_HEADER" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$API_URL")

          jq -e '(.isSuccess // .IsSuccess) == true' <<< "$RESPONSE" >/dev/null

      - name: Add release summary
        shell: bash
        run: |
          {
            echo "### Android APK published"
            echo ""
            echo "- Channel: ${{ needs.build_apk.outputs.channel }}"
            echo "- Version: ${{ needs.build_apk.outputs.version_name }} (${{ needs.build_apk.outputs.version_code }})"
            echo "- SHA-256: \`${{ needs.build_apk.outputs.sha256 }}\`"
            echo "- Size: ${{ needs.build_apk.outputs.size }} bytes"
            echo "- Released at: ${{ needs.build_apk.outputs.released_at }}"
            echo "- Stable: https://coffeepeek.by/downloads/android/${{ needs.build_apk.outputs.channel }}/coffeepeek.apk"
            echo "- Immutable: https://coffeepeek.by/downloads/android/releases/${{ needs.build_apk.outputs.release_dir }}/coffeepeek.apk"
          } >> "$GITHUB_STEP_SUMMARY"

  update_android_version_policy:
    needs: [build_apk, publish_play, publish_apk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require Android 1.0.440 after publication
        shell: bash
        env:
          ADMIN_API_URL: ${{ secrets.COFFEEPEEK_ADMIN_API_URL }}
          ADMIN_TOKEN: ${{ secrets.COFFEEPEEK_ADMIN_TOKEN }}
          VERSION_CODE: ${{ needs.build_apk.outputs.version_code }}
        run: |
          set -euo pipefail
          [[ -n "$ADMIN_API_URL" && -n "$ADMIN_TOKEN" ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ && "$VERSION_CODE" -ge 440 ]]

          API_URL="${ADMIN_API_URL%/}/api/admin/v1/app-downloads"
          AUTH_HEADER="Authorization: Bearer $ADMIN_TOKEN"
          CONFIG=$(curl --fail --silent --show-error \
            --header "$AUTH_HEADER" --header "Accept: application/json" "$API_URL")
          PAYLOAD=$(jq -e -c --argjson code "$VERSION_CODE" '
            select((.isSuccess // .IsSuccess) == true)
            | (.data // .Data) | (.androidVersion // .AndroidVersion)
            | (.latestVersionCode // .LatestVersionCode) as $latest
            | (.minVersionCode // .MinVersionCode) as $min
            | select(($latest | type) == "number" and ($min | type) == "number")
            | select($latest >= 0 and $min >= 0 and $min <= $latest)
            | {latestVersionCode: ([$latest, $code] | max),
               minVersionCode: ([$min, 440] | max)}' <<< "$CONFIG")

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request PUT --header "$AUTH_HEADER" \
            --header "Content-Type: application/json" --data "$PAYLOAD" \
            "$API_URL/android/version")
          jq -e --argjson expected "$PAYLOAD" '
            select((.isSuccess // .IsSuccess) == true)
            | (.data // .Data) | (.androidVersion // .AndroidVersion)
            | (.latestVersionCode // .LatestVersionCode) == $expected.latestVersionCode
              and (.minVersionCode // .MinVersionCode) == $expected.minVersionCode' \
            <<< "$RESPONSE" >/dev/null
          echo "Android version policy: $PAYLOAD" >> "$GITHUB_STEP_SUMMARY"
