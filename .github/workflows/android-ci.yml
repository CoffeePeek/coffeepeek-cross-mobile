name: Android device Debug build
run-name: Android Debug 2642 with compatible signature
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-device-debug-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4474d9a944dda32b73ea67444871cd10ff240794
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Prepare normal Debug backend configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL_MAIN }}
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          url = os.environ['API_BASE_URL'].strip()
          parsed = urlsplit(url)
          assert parsed.scheme == 'https' and parsed.netloc and not parsed.username and not parsed.password
          assert not parsed.query and not parsed.fragment and not any(c.isspace() for c in url)
          config = json.loads(os.environ['FIREBASE_CONFIG'])
          assert config['project_info']['project_id'] == 'coffeepeek'
          assert any(c['client_info']['android_client_info']['package_name'] == 'com.coffeepeek' for c in config['client'])
          Path('local.properties').write_text('API_BASE_URL=' + url + '\nGOOGLE_WEB_CLIENT_ID=\nPOSTHOG_ENABLE_DEV=false\n')
          Path('composeApp/google-services.json').write_text(json.dumps(config))
          PY
      - name: Build Debug and verify packaged runtime classes
        run: ./gradlew --no-daemon --max-workers=6 --no-configuration-cache :composeApp:assembleDirectDebug
      - name: Sign Debug with existing application identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/coffeepeek-device.jks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coffeepeek-device.jks"
          mkdir -p "$RUNNER_TEMP/android-device-artifact"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/coffeepeek-device.jks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/android-device-artifact/CoffeePeek-debug-2642.apk" \
            composeApp/build/outputs/apk/direct/debug/composeApp-direct-debug.apk
      - name: Validate identity and unchanged Debug code
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/android-device-artifact"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$ARTIFACT_DIR/CoffeePeek-debug-2642.apk" > "$ARTIFACT_DIR/signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$ARTIFACT_DIR/CoffeePeek-debug-2642.apk" > "$ARTIFACT_DIR/metadata.txt"
          python3 - <<'PY'
          import hashlib, os, re, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'android-device-artifact'
          cert = re.search(r'certificate SHA-256 digest: ([a-f0-9]+)', (root / 'signature.txt').read_text()).group(1)
          assert cert == '2268057d96f512ea2c45ae1a3be84255b8cc237b1d1c9fc20c5801afd412d260', 'Installed application certificate does not match'
          metadata = (root / 'metadata.txt').read_text()
          assert "name='com.coffeepeek' versionCode='2642'" in metadata
          assert 'application-debuggable' in metadata, 'Expected Debug artifact'
          with zipfile.ZipFile('composeApp/build/outputs/apk/direct/debug/composeApp-direct-debug.apk') as before, zipfile.ZipFile(root / 'CoffeePeek-debug-2642.apk') as after:
              names = [n for n in before.namelist() if re.fullmatch(r'classes[0-9]*\.dex', n)]
              assert names and all(hashlib.sha256(before.read(n)).digest() == hashlib.sha256(after.read(n)).digest() for n in names)
          print('Verified compatible certificate, Debug variant, version2642 and unchanged DEX code')
          PY
          git rev-parse HEAD > "$ARTIFACT_DIR/source-revision.txt"
          cd "$ARTIFACT_DIR"
          sha256sum CoffeePeek-debug-2642.apk > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: android-device-debug-4474d9a9
          path: ${{ runner.temp }}/android-device-artifact/
          if-no-files-found: error
          retention-days: 3
      - name: Remove local signing and client configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/coffeepeek-device.jks" local.properties composeApp/google-services.json
