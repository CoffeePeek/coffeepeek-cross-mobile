name: Android CI

on:
  pull_request:
    branches: [main, develop]
  push:
    # Seed default-branch-scope Gradle caches so PR branches restore them on their first push.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  # Pushes to main seed default-branch caches; cancelling mid-run would skip cache
  # saves, so they queue. PR runs still cancel superseded ones.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Same-repo PRs write caches so follow-up pushes reuse their outputs; forks stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Install Android 37 SDK components
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Create local.properties
        shell: bash
        run: printf 'API_BASE_URL=https://example.com/\nGOOGLE_WEB_CLIENT_ID=\n' > local.properties

      - name: Test APK runtime verification
        run: ./gradlew -p build-logic --no-daemon --max-workers=6 :build-logic-utils:test

      - name: Function body limits (AGENTS.md 40/20)
        run: ./gradlew --no-daemon --max-workers=6 :verifyFunctionBodyLimits

      # Keep dex merging out of the combined build/test/lint heap. Each step gets a fresh daemon.
      - name: Build Direct Debug
        run: >-
          ./gradlew --no-daemon --max-workers=6
          '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8'
          :core:design-system:compileCommonMainKotlinMetadata
          :composeApp:assembleDirectDebug

      - name: Build Play Debug
        run: >-
          ./gradlew --no-daemon --max-workers=6
          '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8'
          :composeApp:assemblePlayDebug

      - name: Android unit tests and lint
        run: >-
          ./gradlew --no-daemon --max-workers=6
          '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8'
          testDebugUnitTest :composeApp:testDirectDebugUnitTest :composeApp:testPlayDebugUnitTest
          lintDebug :composeApp:lintDirectDebug :composeApp:lintPlayDebug
